name: Telegram alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Dipendenze cloud
        run: pip install -r requirements-cloud.txt

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/models/best_model.joblib
            data/models/market_models.joblib
            data/processed/features.csv
          key: cloud-model-v1
          restore-keys: |
            cloud-model-v1
            cloud-model-

      - name: Scarica modello da artefatto se cache assente
        if: hashFiles('data/models/best_model.joblib') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/models data/processed
          found=0
          for workflow in "Aggiorna dati e modello" "Ritreno settimanale"; do
            run_ids=$(gh run list --workflow "$workflow" --status success --limit 3 --json databaseId --jq '.[].databaseId')
            for run_id in $run_ids; do
              arts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[].name')
              for art in $arts; do
                case "$art" in
                  best-model-*|weekly-model-*)
                    rm -rf /tmp/fp-model
                    gh run download "$run_id" -n "$art" -D /tmp/fp-model
                    find /tmp/fp-model -name best_model.joblib -exec cp -t data/models {} +
                    find /tmp/fp-model -name market_models.joblib -exec cp -t data/models {} +
                    find /tmp/fp-model -name features.csv -exec cp -t data/processed {} +
                    if [ -f data/models/best_model.joblib ]; then
                      echo "modelo da artefatto $art (run $run_id)"
                      found=1
                      break
                    fi
                  ;;
                esac
              done
              [ "$found" = 1 ] && break
            done
            [ "$found" = 1 ] && break
          done
          if [ "$found" != 1 ]; then
            echo "ERRORE: best_model.joblib non in cache né in artefatti Actions"
            exit 1
          fi

      - name: Verifica modello prima del job
        run: test -f data/models/best_model.joblib

      - uses: actions/cache/save@v4
        if: hashFiles('data/models/best_model.joblib') != ''
        with:
          path: |
            data/models/best_model.joblib
            data/models/market_models.joblib
            data/processed/features.csv
          key: cloud-model-v1

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/models/calibration.json
            data/models/conformal.json
          key: cloud-learn-${{ github.run_id }}
          restore-keys: |
            cloud-learn-

      - uses: actions/cache/restore@v4
        with:
          path: data/processed/upcoming_predictions.json
          key: cloud-upcoming-${{ github.run_id }}
          restore-keys: |
            cloud-upcoming-

      - uses: actions/cache/restore@v4
        with:
          path: data/processed/telegram_alerts_sent.json
          key: telegram-sent-${{ github.run_id }}
          restore-keys: |
            telegram-sent-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/asian_odds.json
            data/raw/pinnacle_odds.json
            data/raw/odds-api-remaining.txt
            data/raw/betfair_odds.json
          key: odds-cache-${{ github.run_id }}
          restore-keys: |
            odds-cache-

      - name: Asian + Telegram (no apprendimento)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: python scripts/notify_cloud.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/telegram_alerts_sent.json') != ''
        with:
          path: data/processed/telegram_alerts_sent.json
          key: telegram-sent-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/asian_odds.json
            data/raw/pinnacle_odds.json
            data/raw/odds-api-remaining.txt
            data/raw/betfair_odds.json
          key: odds-cache-${{ github.run_id }}
