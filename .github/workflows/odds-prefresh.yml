# Pre-match: archivia quote ricche (quota_pick + EV + fattori) prima del KO.
# 10:00 e 16:00 UTC ≈ 12:00 e 18:00 IT (leggero shift ora solare).
name: Pre-match odds archive

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  odds-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Dipendenze cloud
        run: pip install -r requirements-cloud.txt

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/processed/our_history.sqlite
            data/processed/our_history.sqlite-wal
            data/processed/our_history.sqlite-shm
            data/processed/upcoming_predictions.json
          key: cloud-history-v2
          restore-keys: |
            cloud-history-v2
            cloud-history-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/models/best_model.joblib
            data/models/market_models.joblib
            data/processed/features.csv
          key: cloud-model-v1
          restore-keys: |
            cloud-model-v1
            cloud-model-

      - name: Scarica modello da artefatto se cache assente
        if: hashFiles('data/models/best_model.joblib') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/models data/processed
          found=0
          for workflow in "Aggiorna dati e modello" "Ritreno settimanale"; do
            run_ids=$(gh run list --workflow "$workflow" --status success --limit 3 --json databaseId --jq '.[].databaseId')
            for run_id in $run_ids; do
              arts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[].name')
              for art in $arts; do
                case "$art" in
                  best-model-*|weekly-model-*)
                    rm -rf /tmp/fp-model
                    gh run download "$run_id" -n "$art" -D /tmp/fp-model
                    find /tmp/fp-model -name best_model.joblib -exec cp -t data/models {} +
                    find /tmp/fp-model -name market_models.joblib -exec cp -t data/models {} +
                    find /tmp/fp-model -name features.csv -exec cp -t data/processed {} +
                    if [ -f data/models/best_model.joblib ]; then
                      echo "modelo da artefatto $art (run $run_id)"
                      found=1
                      break
                    fi
                  ;;
                esac
              done
              [ "$found" = 1 ] && break
            done
            [ "$found" = 1 ] && break
          done
          if [ "$found" != 1 ]; then
            echo "ERRORE: best_model.joblib non in cache né in artefatti Actions"
            exit 1
          fi

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/asian_odds.json
            data/raw/pinnacle_odds.json
            data/raw/betfair_odds.json
          key: odds-cache-${{ github.run_id }}
          restore-keys: |
            odds-cache-

      - name: Solo quote pre-match (--odds-update)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          PYTHONUTF8: "1"
        run: |
          python main.py --odds-update
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".").resolve()))
          from modules.data_update.history import history_summary
          hs = history_summary()
          live = hs.get("n_rich_live", "?")
          target = hs.get("n_rich_live_target", 80)
          print(f"live ricche pre-match: {live}/{target}")
          PY

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/our_history.sqlite') != ''
        with:
          path: |
            data/processed/our_history.sqlite
            data/processed/our_history.sqlite-wal
            data/processed/our_history.sqlite-shm
            data/processed/upcoming_predictions.json
          key: cloud-history-v2

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/asian_odds.json
            data/raw/pinnacle_odds.json
            data/raw/betfair_odds.json
          key: odds-cache-${{ github.run_id }}
