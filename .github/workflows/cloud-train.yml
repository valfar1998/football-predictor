# 05:00 UTC = 07:00 in Italia (ora legale). In inverno è 06:00.
# Train + calendario + archive/settle/learn + Telegram (tutto insieme la mattina).
name: Aggiorna dati e modello

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Dipendenze cloud
        run: pip install -r requirements-cloud.txt

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/processed/our_history.sqlite
            data/processed/our_history.sqlite-wal
            data/processed/our_history.sqlite-shm
          key: cloud-history-${{ github.run_id }}
          restore-keys: |
            cloud-history-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/models/residual_ev.json
            data/models/data_signal_weights.json
            data/models/online_learn_report.json
          key: cloud-learn-${{ github.run_id }}
          restore-keys: |
            cloud-learn-

      - uses: actions/cache/restore@v4
        with:
          path: data/processed/upcoming_predictions.json
          key: cloud-upcoming-${{ github.run_id }}
          restore-keys: |
            cloud-upcoming-

      - name: Scarica storico e allena
        env:
          PYTHONUTF8: "1"
        run: python scripts/cloud_bootstrap.py

      - name: Upload modello (artefatto)
        uses: actions/upload-artifact@v4
        with:
          name: best-model-${{ github.run_id }}
          path: |
            data/models/best_model.joblib
            data/models/market_models.joblib
            data/models/metrics.json
            data/models/market_metrics.json
            data/models/calibration.json
            data/models/conformal.json
            data/processed/features.csv
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/cache/save@v4
        with:
          path: |
            data/models/best_model.joblib
            data/models/market_models.joblib
            data/processed/features.csv
          key: cloud-model-${{ github.run_id }}

      - uses: actions/cache/restore@v4
        with:
          path: data/processed/telegram_alerts_sent.json
          key: telegram-sent-${{ github.run_id }}
          restore-keys: |
            telegram-sent-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/asian_odds.json
            data/raw/pinnacle_odds.json
            data/raw/odds-api-remaining.txt
            data/raw/betfair_odds.json
          key: odds-cache-${{ github.run_id }}
          restore-keys: |
            odds-cache-

      - name: Calendario + apprendi + Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          PYTHONUTF8: "1"
          CLOUD_DAILY_LEARN: "1"
          CLOUD_FULL_REBUILD: "1"
        run: python scripts/notify_cloud.py

      - name: Upload apprendimento (artefatto)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-learn-${{ github.run_id }}
          path: |
            data/models/calibration.json
            data/models/residual_ev.json
            data/models/data_signal_weights.json
            data/models/online_learn_report.json
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/telegram_alerts_sent.json') != ''
        with:
          path: data/processed/telegram_alerts_sent.json
          key: telegram-sent-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/our_history.sqlite') != ''
        with:
          path: |
            data/processed/our_history.sqlite
            data/processed/our_history.sqlite-wal
            data/processed/our_history.sqlite-shm
          key: cloud-history-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/models/calibration.json
            data/models/residual_ev.json
            data/models/data_signal_weights.json
            data/models/online_learn_report.json
            data/models/conformal.json
          key: cloud-learn-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/upcoming_predictions.json') != ''
        with:
          path: data/processed/upcoming_predictions.json
          key: cloud-upcoming-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/asian_odds.json
            data/raw/pinnacle_odds.json
            data/raw/odds-api-remaining.txt
            data/raw/betfair_odds.json
          key: odds-cache-${{ github.run_id }}
